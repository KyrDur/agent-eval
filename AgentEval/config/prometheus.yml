# Prometheus 配置文件 — 电商 Agent 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'agenteval'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # 电商 Agent 主应用指标
  - job_name: 'agenteval-app'
    static_configs:
      - targets: ['agenteval:8000']
        labels:
          service: 'agenteval'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
